<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>Claude Help</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Claude 额度</h1>
    <label>排序
      <select id="sort">
        <option value="weekly">每周剩余</option>
        <option value="fiveHour">5 小时剩余</option>
        <option value="recorded">最近记录时间</option>
      </select>
    </label>
  </header>
  <div id="notice" role="status" hidden></div>
  <div id="cards"></div>

  <section id="sitesPanel" hidden>
    <div class="panel-head">
      <strong>收信地址</strong>
      <span class="muted">按邮箱后缀选择点「收信」时在浏览器打开的网址</span>
    </div>
    <div id="sitesRows"></div>
    <div class="panel-actions">
      <button id="sitesAdd" class="btn" type="button">新增一行</button>
      <span class="spacer"></span>
      <span id="sitesMsg" class="muted"></span>
      <button id="sitesCancel" class="btn" type="button">取消</button>
      <button id="sitesSave" class="btn primary" type="button">保存</button>
    </div>
  </section>

  <footer class="bar">
    <span>Claude Help v<span id="version"></span></span>
    <span id="updateStatus" class="grow"></span>
    <button id="sitesBtn" class="btn" type="button">收信地址</button>
    <button id="updateBtn" class="btn" type="button">检查更新</button>
  </footer>
</div>
<script src="../core/format.js"></script>
<script src="renderer.js"></script>
</body>
</html>
