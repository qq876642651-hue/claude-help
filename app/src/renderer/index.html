<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>Claude Help</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <nav class="nav" data-i18n-aria="nav.aria">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#d97757"/><circle cx="50" cy="50" r="31" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="9"/><circle cx="50" cy="50" r="31" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="136 195" transform="rotate(-90 50 50)"/><path d="M50 36V64M36 50H64M40.1 40.1L59.9 59.9M59.9 40.1L40.1 59.9" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg></span>
      <span class="brand-name">Claude Help</span>
    </div>
    <button class="nav-item" type="button" data-page="usage">
      <span class="icon" data-icon="gauge"></span><span data-i18n="nav.usage"></span>
    </button>
    <button class="nav-item" type="button" data-page="sites">
      <span class="icon" data-icon="link"></span><span data-i18n="nav.sites"></span>
    </button>
    <button class="nav-item" type="button" data-page="sessions">
      <span class="icon" data-icon="history"></span><span data-i18n="nav.sessions"></span>
    </button>
    <button class="nav-item" type="button" data-page="about">
      <span class="icon" data-icon="info"></span><span data-i18n="nav.about"></span>
      <i class="nav-dot" id="updateDot" hidden></i>
    </button>
    <div class="nav-foot">v<span id="navVersion"></span></div>
  </nav>

  <main class="main">
    <!-- 额度 -->
    <section class="page" id="page-usage" hidden>
      <header class="page-head">
        <div class="page-title">
          <h1 data-i18n="nav.usage"></h1>
          <p class="sub" id="usageSummary"></p>
        </div>
        <div class="toolbar">
          <label class="search">
            <span class="icon" data-icon="search"></span>
            <input id="usageSearch" type="search" data-i18n-placeholder="usage.search" autocomplete="off" spellcheck="false">
          </label>
          <div class="segmented" id="usageSort" role="radiogroup" data-i18n-aria="usage.sortAria">
            <button type="button" role="radio" data-sort="weekly" data-i18n="usage.sortWeekly"></button>
            <button type="button" role="radio" data-sort="fiveHour" data-i18n="usage.sortFiveHour"></button>
            <button type="button" role="radio" data-sort="recorded" data-i18n="usage.sortRecorded"></button>
          </div>
          <button class="btn" type="button" id="usageAdd"><span class="icon" data-icon="plus"></span><span data-i18n="usage.add"></span></button>
        </div>
      </header>
      <div class="page-body">
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <!-- 收信地址 -->
    <section class="page" id="page-sites" hidden>
      <header class="page-head">
        <div class="page-title">
          <h1 data-i18n="nav.sites"></h1>
          <p class="sub" data-i18n="sites.sub"></p>
        </div>
      </header>
      <div class="page-body narrow">
        <form class="panel site-form" id="siteForm" novalidate>
          <label class="field">
            <span class="field-label" data-i18n="sites.domain"></span>
            <input id="siteDomain" data-i18n-placeholder="sites.domainPlaceholder" autocomplete="off" spellcheck="false">
            <em class="field-hint" id="siteDomainHint"></em>
          </label>
          <label class="field grow">
            <span class="field-label" data-i18n="sites.url"></span>
            <input id="siteUrl" placeholder="https://" autocomplete="off" spellcheck="false">
            <em class="field-hint" id="siteUrlHint"></em>
          </label>
          <button class="btn primary" type="submit"><span class="icon" data-icon="plus"></span><span data-i18n="common.add"></span></button>
        </form>
        <div class="panel site-list" id="siteList"></div>
      </div>
    </section>

    <!-- 会话 -->
    <section class="page" id="page-sessions" hidden>
      <header class="page-head">
        <div class="page-title">
          <h1 data-i18n="nav.sessions"></h1>
          <p class="sub" id="sessionsSummary"></p>
        </div>
        <div class="toolbar">
          <label class="search">
            <span class="icon" data-icon="search"></span>
            <input id="sessionsSearch" type="search" data-i18n-placeholder="sessions.search" autocomplete="off" spellcheck="false">
          </label>
        </div>
      </header>
      <div class="page-body narrow" id="sessionList"></div>
    </section>

    <!-- 关于 -->
    <section class="page" id="page-about" hidden>
      <header class="page-head">
        <div class="page-title">
          <h1 data-i18n="nav.about"></h1>
          <p class="sub" data-i18n="about.sub"></p>
        </div>
      </header>
      <div class="page-body narrow">
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>Claude Help <span class="muted" id="aboutVersion"></span></h2>
              <p class="sub" id="updateText" data-i18n="about.updateAuto"></p>
            </div>
            <button class="btn" type="button" id="updateBtn"><span class="icon" data-icon="refresh"></span><span data-i18n="about.check"></span></button>
          </div>
          <div class="progress" id="updateProgress" hidden><span></span></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="about.closeTitle"></h2>
              <p class="sub" data-i18n="about.closeSub"></p>
            </div>
            <div class="segmented" id="closeAction" role="radiogroup" data-i18n-aria="about.closeTitle">
              <button type="button" role="radio" data-value="ask" data-i18n="about.closeAsk"></button>
              <button type="button" role="radio" data-value="tray" data-i18n="about.closeTray"></button>
              <button type="button" role="radio" data-value="quit" data-i18n="about.closeQuit"></button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="about.langTitle"></h2>
              <p class="sub" data-i18n="about.langSub"></p>
            </div>
            <div class="segmented" id="language" role="radiogroup" data-i18n-aria="about.langTitle">
              <button type="button" role="radio" data-value="system" data-i18n="about.langSystem"></button>
              <button type="button" role="radio" data-value="zh" lang="zh-CN">中文</button>
              <button type="button" role="radio" data-value="en" lang="en">English</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="about.cliTitle"></h2>
              <p class="sub" data-i18n="about.cliSub"></p>
            </div>
          </div>
          <ul class="cmd-list" id="cmdList"></ul>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="about.dataTitle"></h2>
              <p class="sub mono" id="dataDir"></p>
            </div>
            <button class="btn" type="button" id="openDataDir"><span class="icon" data-icon="folder"></span><span data-i18n="about.openDir"></span></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- 安装更新时盖住整个窗口，界面同时设为 inert -->
<div class="install-overlay" id="installOverlay" hidden>
  <div class="install-card" role="alertdialog" aria-labelledby="installTitle" aria-describedby="installText">
    <span class="spinner" aria-hidden="true"></span>
    <h2 id="installTitle" data-i18n="install.title"></h2>
    <p class="sub" id="installText" data-i18n="install.text"></p>
  </div>
</div>

<dialog class="confirm close-dialog" id="closeDialog">
  <form method="dialog">
    <h2 data-i18n="close.title"></h2>
    <p class="sub" data-i18n="close.sub"></p>
    <label class="check"><input type="checkbox" id="closeRemember"><span data-i18n="close.remember"></span></label>
    <div class="confirm-actions">
      <button class="btn ghost" value="cancel" type="submit" data-i18n="common.cancel"></button>
      <button class="btn" value="quit" type="submit" data-i18n="close.quit"></button>
      <button class="btn primary" value="tray" type="submit" autofocus data-i18n="close.tray"></button>
    </div>
  </form>
</dialog>

<dialog class="confirm add-dialog" id="addAccountDialog">
  <form method="dialog" id="addAccountForm" novalidate>
    <h2 data-i18n="add.title"></h2>
    <label class="field">
      <span class="field-label" data-i18n="add.email"></span>
      <input id="addAccountEmail" type="email" placeholder="name@example.com" autocomplete="off" spellcheck="false">
      <em class="field-hint" id="addAccountHint"></em>
    </label>
    <p class="sub" data-i18n="add.sub"></p>
    <div class="confirm-actions">
      <button class="btn" value="cancel" type="button" id="addAccountCancel" data-i18n="common.cancel"></button>
      <button class="btn primary" type="submit"><span class="icon" data-icon="plus"></span><span data-i18n="common.add"></span></button>
    </div>
  </form>
</dialog>

<dialog class="confirm" id="confirmDialog">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button class="btn" value="cancel" type="submit" data-i18n="common.cancel"></button>
      <button class="btn danger" value="ok" type="submit" id="confirmOk" data-i18n="common.ok"></button>
    </div>
  </form>
</dialog>

<script src="../core/format.js"></script>
<script src="../i18n.js"></script>
<script src="ui.js"></script>
<script src="page-usage.js"></script>
<script src="page-sites.js"></script>
<script src="page-sessions.js"></script>
<script src="page-about.js"></script>
<script src="app.js"></script>
</body>
</html>
